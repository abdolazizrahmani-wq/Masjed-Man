<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle ornamental Islamic star geometric border -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.35" />

  <!-- Mosque Dome and Architecture -->
  <g transform="translate(0, 10)">
    <!-- Main Center Dome -->
    <path d="M 256 128 C 210 128 174 180 170 240 L 342 240 C 338 180 302 128 256 128 Z" fill="url(#domeGrad)" />
    
    <!-- Dome Finial and Crescent -->
    <path d="M 256 80 L 256 128" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="256" cy="74" r="5" fill="url(#goldGrad)" />
    <!-- Crescent Moon -->
    <path d="M 258 54 A 18 18 0 1 1 242 78 A 14 14 0 1 0 258 54 Z" fill="url(#goldGrad)" filter="url(#glow)" />

    <!-- Left Minaret -->
    <rect x="110" y="190" width="28" height="190" rx="4" fill="#047857" />
    <path d="M 124 150 L 110 190 L 138 190 Z" fill="url(#goldGrad)" />
    <circle cx="124" cy="144" r="4" fill="url(#goldGrad)" />
    <rect x="105" y="240" width="38" height="6" rx="2" fill="url(#goldGrad)" />

    <!-- Right Minaret -->
    <rect x="374" y="190" width="28" height="190" rx="4" fill="#047857" />
    <path d="M 388 150 L 374 190 L 402 190 Z" fill="url(#goldGrad)" />
    <circle cx="388" cy="144" r="4" fill="url(#goldGrad)" />
    <rect x="369" y="240" width="38" height="6" rx="2" fill="url(#goldGrad)" />

    <!-- Mosque Base & Arches -->
    <path d="M 150 240 L 362 240 L 362 380 L 150 380 Z" fill="#065f46" />
    
    <!-- Central Arch Gate (Mihrab shape) -->
    <path d="M 226 380 L 226 300 C 226 270 286 270 286 300 L 286 380 Z" fill="#022c22" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Side Arches -->
    <path d="M 172 380 L 172 320 C 172 295 212 295 212 320 L 212 380 Z" fill="#022c22" opacity="0.6" />
    <path d="M 300 380 L 300 320 C 300 295 340 295 340 320 L 340 380 Z" fill="#022c22" opacity="0.6" />

    <!-- Base Platform Steps -->
    <rect x="80" y="380" width="352" height="14" rx="3" fill="url(#goldGrad)" />
    <rect x="60" y="394" width="392" height="14" rx="4" fill="#047857" />

    <!-- Quran Open Book Motif at Bottom -->
    <g transform="translate(256, 436) scale(0.85)">
      <!-- Left Page -->
      <path d="M 0 0 C -25 -10 -55 -10 -75 5 L -75 25 C -55 10 -25 10 0 20 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
      <!-- Right Page -->
      <path d="M 0 0 C 25 -10 55 -10 75 5 L 75 25 C 55 10 25 10 0 20 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
      <!-- Book spine & star -->
      <circle cx="0" cy="8" r="4" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>
